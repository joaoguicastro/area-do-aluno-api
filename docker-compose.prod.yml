services:
  postgres:
    image: postgres:16
    container_name: areadoaluno-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: areadoaluno
    volumes:
      - /srv/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d areadoaluno"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: areadoaluno-api
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
    # expõe apenas na loopback do host; Nginx fará o proxy
    ports:
      - "127.0.0.1:3333:3333"
    volumes:
      - /srv/data/uploads:/app/uploads
    restart: unless-stopped
